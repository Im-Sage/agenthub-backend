version: '3.8'

services:
  # Redis - 阶段二/三的核心，用于 Celery 任务队列和 WebSocket 推送
  # 这里推荐使用 redis-stack，因为它带有一个可视化的管理界面 (RedisInsight)
  redis:
    image: redis/redis-stack:latest
    container_name: agenthub-redis
    ports:
      - "6379:6379"   # Redis 端口
      - "8001:8001"   # RedisInsight 可视化界面 (浏览器访问 http://localhost:8001)
    volumes:
      - redis_data:/data
    restart: no

  # RabbitMQ - 可作为 Celery 的另一种消息中间件选择
  rabbitmq:
    image: rabbitmq:management
    container_name: agenthub-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672" # 管理后台 (浏览器访问 http://localhost:15672)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: always

  # MinIO - 用于后续阶段存储文件、日志等
  minio:
    image: minio/minio:latest
    container_name: agenthub-minio
    ports:
      - "9000:9000" # API 端口
      - "9001:9001" # 管理后台 (浏览器访问 http://localhost:9001)
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: always

  # MySQL - 项目规划中后续要替换 SQLite 的数据库
  mysql:
    image: mysql:8.0
    container_name: agenthub-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: agenthub
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always

  # MongoDB - 你之前装过的，一并整理进来
  mongo:
    image: mongo:latest
    container_name: agenthub-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always

  # MongoDB 可视化管理界面
  mongo-express:
    image: mongo-express:latest
    container_name: agenthub-mongo-express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
    depends_on:
      - mongo
    restart: always

  # Elasticsearch - 搜索增强（可选）
  elasticsearch:
    image: elasticsearch:7.17.10
    container_name: agenthub-es
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9201:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    restart: always

  # Kibana - ES 可视化界面
  kibana:
    image: kibana:7.17.10
    container_name: agenthub-kibana
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    restart: always

volumes:
  redis_data:
  rabbitmq_data:
  minio_data:
  mysql_data:
  mongo_data:
  es_data:
